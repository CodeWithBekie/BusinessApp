services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aibp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aibp_dev
      POSTGRES_USER: aibp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host port remapped — 5432 is already in use by another local project on this machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibp -d aibp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: aibp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: aibp
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # Host ports remapped — 5672/15672 are already in use by another local project on this machine.
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  rabbitmqdata:
